# ========= CONFIGURACIÓN DEL SERVIDOR WEB =========
server.port=8080

# ========= CONFIGURACIÓN DE LA BASE DE DATOS (DATASOURCE) =========
# URL de conexión a tu base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/portal
spring.datasource.username=${POSTGRE_DB_USER:postgres}
spring.datasource.password=${POSTGRE_DB_PASSWORD}

# ========= CONFIGURACIÓN DE JPA (HIBERNATE) =========
# Le dice a Hibernate que dialecto de SQL usar
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Opcional: Muestra el SQL que Hibernate genera en la consola (muy útil para depurar)
spring.jpa.show-sql=true
# Opcional: Formatea el SQL mostrado en la consola para que sea legible
spring.jpa.properties.hibernate.format_sql=true

# ========= CONFIGURACIÓN DE FLYWAY =========
# Habilita Flyway (está habilitado por defecto si la dependencia existe)
spring.flyway.enabled=true
# Indica a Flyway dónde buscar los scripts de migración.
# 'classpath:db/migration' es la ruta estándar: src/main/resources/db/migration
spring.flyway.locations=classpath:db/migration